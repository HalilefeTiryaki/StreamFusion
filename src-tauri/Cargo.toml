[package]
name = "streamfusion"
version = "0.1.0"
description = "High-performance multi-platform RTMP restreamer"
edition = "2021"

[lib]
name = "streamfusion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net", "time", "sync"] }
tokio-util = "0.7"
sysinfo = "0.32"
rml_rtmp = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
